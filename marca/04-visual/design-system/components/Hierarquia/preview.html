<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>@font-face{font-family:"Clash Display";src:url("../../../../../assets/fontes/ClashDisplay-Variable.ttf");font-weight:200 700}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Regular.ttf");font-weight:400}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Medium.ttf");font-weight:500}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-SemiBold.ttf");font-weight:600}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Italic.ttf");font-weight:400;font-style:italic}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-text);color:var(--ink);background:var(--bg)}
.star{display:inline-block;width:1em;height:1em;vertical-align:-0.12em}

.g{display:grid;grid-template-columns:1fr 1fr}
.p{padding:32px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.palco{background:var(--lilas);color:var(--preto)}
.gab{background:var(--bg)}
.hl{font-family:var(--font-display);font-weight:500;font-size:67px;line-height:1.02;letter-spacing:-.02em}
.hl mark{background:var(--lima);color:var(--preto);padding:0 .12em;border-radius:.1em}
.sh{font-family:var(--font-text);font-weight:500;font-size:21px;line-height:1.3}
.bd{font-family:var(--font-text);font-size:16px;line-height:1.55;max-width:36ch}
.cta{font-family:var(--font-text);font-weight:600;font-size:16px;padding:14px 24px;border-radius:9999px;background:var(--preto);color:var(--branco);border:0}
.gab .hl{font-size:50px}
.lab{font-size:12px;font-weight:500;letter-spacing:.02em;opacity:.8}
</style></head><body><div class="g">
<div class="p palco" data-theme="palco"><span class="lab">Palco</span><div class="hl">seu <mark>mago</mark> do design</div><div class="sh">Tiro uma marca do chapéu em minutos.</div><p class="bd">Me conta sua ideia, Bia. Eu cuido da estratégia e o designer parceiro cuida do acabamento.</p><button class="cta">crie sua marca</button></div>
<div class="p gab" data-theme="gabinete"><span class="lab">Gabinete</span><div class="hl">seu mago da <mark>estratégia</mark></div><div class="sh">Posicionamento, voz e visual na mesma conversa.</div><p class="bd">Cada decisão vem com o porquê, para você aprovar com segurança.</p><button class="cta">ver caminhos</button></div>
</div></body></html>
