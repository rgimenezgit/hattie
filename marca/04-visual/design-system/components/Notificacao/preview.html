<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>@font-face{font-family:"Clash Display";src:url("../../../../../assets/fontes/ClashDisplay-Variable.ttf");font-weight:200 700}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Regular.ttf");font-weight:400}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Medium.ttf");font-weight:500}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-SemiBold.ttf");font-weight:600}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Italic.ttf");font-weight:400;font-style:italic}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-text);color:var(--ink);background:var(--bg)}
.star{display:inline-block;width:1em;height:1em;vertical-align:-0.12em}

.w{padding:24px 28px;display:grid;gap:14px;max-width:640px}
.t{display:flex;gap:14px;align-items:center;padding:16px;border:2px solid var(--ink);border-radius:16px;background:var(--surface)}
.t.ok{background:var(--lima);color:var(--preto);border-color:var(--preto)}
.t.er{background:var(--preto);color:var(--branco);border-color:var(--preto)}
.sel{padding:8px 16px;border-radius:9999px;font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1;background:var(--lima);color:var(--preto);white-space:nowrap}
.t.ok .sel{background:var(--preto);color:var(--lima)}
h4{font-family:var(--font-display);font-weight:500;font-size:21px;letter-spacing:-.01em}
p{font-size:14px;line-height:1.5}
</style></head><body><div class="w">
<div class="t"><span class="sel">plimm</span><div><h4>Logotipo pronto</h4><p>Bia, tirei do chapéu 3 caminhos para o logotipo.</p></div></div>
<div class="t ok"><span class="sel">cling</span><div><h4>Etapa aprovada</h4><p>Bia, o posicionamento está aprovado. Seguimos para a identidade visual.</p></div></div>
<div class="t er"><div><svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg></div><div><h4>Pagamento não confirmado</h4><p>Bia, o banco recusou o cartão. Você pode tentar outro cartão ou pagar com Pix.</p></div></div>
</div></body></html>
