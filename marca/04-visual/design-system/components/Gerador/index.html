<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de grafismo</title>
<style>
@font-face{font-family:Clash;src:url(../../../ClashDisplay-Variable.ttf),url(../fontes/ClashDisplay-Variable.ttf);font-weight:200 700}
@font-face{font-family:Poppins;src:url(../../../Poppins-Regular.ttf),url(../fontes/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:Poppins;src:url(../../../Poppins-Medium.ttf),url(../fontes/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Poppins;src:url(../../../Poppins-SemiBold.ttf),url(../fontes/Poppins-SemiBold.ttf);font-weight:600}
:root{
  --branco:#F5F5F5;--cinza:#D3D3D3;--cinza-medio:#6B6B6B;--grafite:#333333;--preto:#101010;--lima:#E6F344;
  --painel:#FFFFFF;--palco:color-mix(in srgb,var(--cinza) 45%,var(--branco));--linha:color-mix(in srgb,var(--cinza) 55%,transparent);
  --trilho:color-mix(in srgb,var(--cinza) 70%,var(--branco));
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--palco);color:var(--preto);font:400 13px/1.4 Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus{outline:none}
:focus-visible{box-shadow:0 0 0 2px var(--palco),0 0 0 4px var(--preto);border-radius:8px}
.hidden{display:none!important}

/* topo */
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--painel)}
.marca{display:flex;align-items:center;gap:8px;font:500 18px Clash,sans-serif;white-space:nowrap}
.marca svg{width:18px;height:18px}
.tam{display:flex;align-items:center;gap:6px;margin-left:16px}
.tam select,.tam input{height:32px;border:0;border-radius:8px;background:var(--branco);padding:0 8px}
.tam input{width:64px;text-align:center;font-variant-numeric:tabular-nums}
.tam .x{color:var(--cinza-medio)}
.esp{flex:1}
.btn{height:36px;padding:0 14px;border-radius:999px;background:var(--branco);display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--cinza)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--preto);color:var(--lima)}
.btn.pri:hover{background:var(--grafite)}
.icone{width:36px;padding:0;justify-content:center}
.menu{position:absolute;right:16px;top:52px;max-width:calc(100vw - 32px);z-index:20;background:var(--painel);border-radius:14px;box-shadow:0 12px 40px rgba(16,16,16,.18);padding:8px;width:260px}
.menu button{display:flex;width:100%;text-align:left;padding:9px 10px;border-radius:8px;justify-content:space-between;gap:8px}
.menu button:hover{background:var(--branco)}
.menu small{color:var(--cinza-medio)}
.menu .sep{height:1px;background:var(--linha);margin:6px 4px}
.menu .lin{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 8px}
.menu .seg{flex-wrap:nowrap}.menu .seg button{width:40px;justify-content:center;padding:0}

/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr) 296px;height:calc(100% - 56px)}
.esq,.dir{background:var(--painel);overflow:auto;padding:12px 16px 40px}
.esq{border-radius:0 0 20px 0}
.dir{border-radius:0 0 0 20px}
.palco{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;min-height:0;overflow:hidden}
.quadro{position:relative;box-shadow:0 18px 50px rgba(16,16,16,.16);border-radius:4px;overflow:hidden;background:var(--branco)}
.quadro.xadrez{background:repeating-conic-gradient(var(--cinza) 0 25%,var(--branco) 0 50%) 0 0/16px 16px}
.quadro canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.info{margin-top:14px;color:var(--cinza-medio);font-size:12px;font-variant-numeric:tabular-nums;text-align:center}

/* painéis */
h2{font:500 17px Clash,sans-serif;margin:18px 0 10px}
h2:first-child{margin-top:6px}
.sec{padding-bottom:14px;border-bottom:1px solid var(--linha)}
.sec:last-child{border-bottom:0}
.dica{color:var(--cinza-medio);font-size:12px;margin:6px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--branco);border-radius:10px;padding:3px}
.seg.g3{display:grid;grid-template-columns:repeat(3,1fr)}
.seg.g6{display:grid;grid-template-columns:1.9fr repeat(5,1fr)}
.seg button{flex:1 1 auto;min-width:0;height:30px;padding:0 8px;border-radius:8px;color:var(--grafite);white-space:nowrap}
.seg button:hover{color:var(--preto)}
.seg button[aria-pressed=true]{background:var(--painel);color:var(--preto);font-weight:500;box-shadow:0 1px 4px rgba(16,16,16,.12)}
.campo{margin-top:12px}
.campo .rot{display:flex;justify-content:space-between;color:var(--grafite);font-size:12px;margin-bottom:4px}
.campo .rot b{font-weight:500;color:var(--preto);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--trilho)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--trilho)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--preto);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--preto);border:0}
.chave{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--grafite);font-size:12px;cursor:pointer}
.chave input{appearance:none;-webkit-appearance:none;width:32px;height:18px;border-radius:999px;background:var(--trilho);position:relative;cursor:pointer;margin:0;transition:background .15s}
.chave input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--painel);transition:transform .15s}
.chave input:checked{background:var(--preto)}
.chave input:checked::after{transform:translateX(14px);background:var(--lima)}

/* cores */
.vazia{background:repeating-conic-gradient(var(--cinza) 0 25%,var(--painel) 0 50%) 0 0/10px 10px!important}
.cores{display:flex;flex-direction:column;gap:2px}
.cor{display:grid;grid-template-columns:14px 28px 1fr 58px 24px;align-items:center;gap:8px;padding:4px 4px 4px 2px;border-radius:10px;background:var(--painel)}
.cor:hover,.cor.sel{background:var(--branco)}
.cor.arrastando{box-shadow:0 8px 24px rgba(16,16,16,.16);position:relative;z-index:2;background:var(--painel)}
.grip{width:14px;height:28px;color:var(--cinza);display:grid;place-items:center;cursor:grab;touch-action:none}
.cor:hover .grip,.grip:focus-visible{color:var(--cinza-medio)}
.grip svg{width:10px;height:14px}
.amostra{width:28px;height:28px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(16,16,16,.08)}
.cor .nome{line-height:1.15;min-width:0}
.cor .nome small{display:block;color:var(--cinza-medio);font-size:11px;font-variant-numeric:tabular-nums}
.pos{position:relative}
.pos::after{content:"%";position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--cinza-medio);font-size:11px;pointer-events:none}
.cor input{width:58px;height:28px;border:0;border-radius:8px;background:var(--branco);text-align:right;padding:0 20px 0 6px;font-variant-numeric:tabular-nums}
.cor:hover input,.cor.sel input{background:var(--painel)}
.cor .tirar{width:24px;height:24px;border-radius:6px;color:var(--cinza-medio);display:grid;place-items:center}
.cor .tirar:hover{background:var(--cinza);color:var(--preto)}
/* barra de paradas */
.trilho{position:relative;padding-top:32px;margin:2px 11px 12px}
.tira{display:block;width:100%;height:24px;border-radius:6px;image-rendering:pixelated;cursor:copy;background:repeating-conic-gradient(var(--cinza) 0 25%,var(--painel) 0 50%) 0 0/8px 8px}
.stop{position:absolute;top:0;width:22px;height:22px;margin-left:-11px;border-radius:6px;box-shadow:0 0 0 2px var(--painel),0 2px 6px rgba(16,16,16,.28);cursor:grab;touch-action:none}
.stop::after{content:"";position:absolute;left:50%;top:100%;margin:2px 0 0 -4px;border:4px solid transparent;border-top-color:var(--painel)}
.stop[aria-pressed=true]{box-shadow:0 0 0 2px var(--painel),0 0 0 4px var(--preto),0 2px 6px rgba(16,16,16,.28);z-index:1}
.stop[aria-pressed=true]::after{border-top-color:var(--preto);margin-top:4px}
/* imagem de fundo */
.img{display:grid;grid-template-columns:44px 1fr auto 24px;align-items:center;gap:10px;padding:4px;border-radius:10px;background:var(--branco)}
.img img{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block}
.img .nome{min-width:0;line-height:1.2}
.img .nome span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img .nome small{color:var(--cinza-medio);font-size:11px;font-variant-numeric:tabular-nums}
.img .btn{height:28px;font-size:12px;padding:0 10px;background:var(--painel)}
.img .tirar{width:24px;height:24px;border-radius:6px;color:var(--cinza-medio);display:grid;place-items:center}
.img .tirar:hover{background:var(--cinza);color:var(--preto)}
/* alças no quadro */
.moldura{position:relative}
.alcas{position:absolute;inset:0;pointer-events:none}
.alcas svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.alcas .ln{stroke:#FFFFFF;stroke-width:1.5;filter:drop-shadow(0 0 1.5px rgba(16,16,16,.7))}
.alcas .tick{stroke:#FFFFFF;stroke-width:1.5;filter:drop-shadow(0 0 1px rgba(16,16,16,.6))}
.alcas .guia{stroke:#FFFFFF;stroke-opacity:.75;stroke-width:1;stroke-dasharray:4 4;fill:none;filter:drop-shadow(0 0 1px rgba(16,16,16,.6))}
.alcas .hit{stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:copy}
.alca{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 1px rgba(16,16,16,.2),0 1px 5px rgba(16,16,16,.4);pointer-events:auto;touch-action:none;cursor:move}
.alca.menor{width:10px;height:10px;margin:-5px 0 0 -5px}
.alca.centro::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--preto)}
.pq{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:7px;box-shadow:0 0 0 3px #FFFFFF,0 0 0 4px rgba(16,16,16,.18),0 3px 10px rgba(16,16,16,.45);pointer-events:auto;touch-action:none;cursor:grab}
.pq[aria-pressed=true]{box-shadow:0 0 0 3px #FFFFFF,0 0 0 5px var(--preto),0 3px 10px rgba(16,16,16,.45);z-index:1}
.palco.soltando .quadro{box-shadow:0 0 0 3px var(--lima),0 18px 50px rgba(16,16,16,.16)}
.acoes{display:flex;gap:6px;margin-top:8px}
.acoes .btn{height:30px;font-size:12px;padding:0 12px}
.pop{position:fixed;z-index:30;background:var(--painel);border-radius:14px;box-shadow:0 12px 40px rgba(16,16,16,.2);padding:10px;display:grid;grid-template-columns:repeat(5,32px);gap:6px}
.pop button{width:32px;height:32px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(16,16,16,.08)}
.pop button:hover{transform:scale(1.08)}
.pop button[aria-pressed=true]{box-shadow:0 0 0 2px var(--painel),0 0 0 4px var(--preto)}
.degraus{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.degraus button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--grafite);padding:6px 0;border-radius:10px}
.degraus button:hover{background:var(--branco)}
.fundo{display:flex;align-items:center;gap:10px;margin-top:12px}
.fundo button{display:flex;align-items:center;gap:10px;padding:4px;border-radius:10px;flex:1;text-align:left}
.fundo button:hover{background:var(--branco)}

/* presets */
.grupo{margin-bottom:6px}
.grupo h3{font:500 11px Poppins,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--cinza-medio);margin:18px 0 8px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumb{display:flex;flex-direction:column;gap:5px;text-align:left;border-radius:10px;padding:0}
.thumb canvas{width:100%;aspect-ratio:4/3;border-radius:8px;display:block;image-rendering:pixelated;box-shadow:inset 0 0 0 1px rgba(16,16,16,.06);transition:transform .15s}
.thumb:hover canvas{transform:translateY(-1px)}
.thumb span{font-size:11px;line-height:1.25;color:var(--grafite);padding:0 2px}
.thumb[aria-pressed=true] span{color:var(--preto);font-weight:600}
.thumb[aria-pressed=true] canvas{box-shadow:0 0 0 2px var(--painel),0 0 0 4px var(--preto)}
.salvar{display:flex;gap:6px}
.salvar input{flex:1;min-width:0;height:32px;border:0;border-radius:8px;background:var(--branco);padding:0 10px}
.salvar .btn{height:32px;padding:0 12px}
.salvos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:999px;background:var(--branco);font-size:12px}
.chip:hover{background:var(--cinza)}
.chip .x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--cinza-medio)}
.chip .x:hover{background:var(--painel);color:var(--preto)}

.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--preto);color:var(--branco);padding:10px 16px;border-radius:999px;font-size:13px;transition:.2s;pointer-events:none;z-index:40;display:flex;gap:8px;align-items:center}
.aviso::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lima)}
.aviso.on{opacity:1;transform:translateX(-50%)}

@media (max-width:1000px){
  .app{grid-template-columns:1fr;height:auto}
  .palco{min-height:62vh;order:-1}
  .esq,.dir{border-radius:20px;margin:0 12px 12px;overflow:visible}
  .thumbs{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .tam select{max-width:120px}
  .top{flex-wrap:wrap;height:auto;padding:10px 16px}
  .tam{margin-left:0;order:5;width:100%}
}
@media (max-width:560px){.top .btn .txt{display:none}.marca span{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="marca"><svg viewBox="0 0 709 660" aria-hidden="true"><path id="astpath" fill="currentColor" d="M293.649 426.264L251.957 642.616C250.22 651.633 257.129 660 266.311 660H441.28C450.447 660 457.352 651.66 455.641 642.654L414.527 426.261L595.096 575.441C601.941 581.095 612.204 579.393 616.857 571.832L706.825 425.628C711.719 417.674 708.003 407.234 699.184 404.162L486.261 330L699.184 255.838C708.003 252.766 711.719 242.326 706.825 234.372L616.857 88.1678C612.204 80.6068 601.941 78.9048 595.096 84.5593L414.527 233.739L455.641 17.3465C457.352 8.3404 450.447 0 441.28 0H266.311C257.129 0 250.22 8.3671 251.957 17.3839L293.649 233.736L112.529 84.5913C105.654 78.9296 95.3559 80.6801 90.7374 88.2957L2.12524 234.414C-2.69706 242.365 1.03391 252.739 9.81623 255.798L222.853 330L9.81621 404.202C1.03389 407.261 -2.69705 417.635 2.12525 425.587L90.7374 571.704C95.3559 579.32 105.653 581.07 112.529 575.409L293.649 426.264Z"/></svg><span>gerador de grafismo</span></div>
  <div class="tam">
    <select id="formato" aria-label="Formato do quadro"></select>
    <input id="larg" type="number" min="64" max="4096" aria-label="Largura em pixels">
    <span class="x">×</span>
    <input id="alt" type="number" min="64" max="4096" aria-label="Altura em pixels">
    <button class="btn icone" id="girarQuadro" aria-label="Trocar largura e altura" title="Trocar largura e altura"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></button>
  </div>
  <div class="esp"></div>
  <button class="btn icone" id="play" aria-label="Pausar movimento"></button>
  <button class="btn" id="sortear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg><span class="txt">Sortear</span></button>
  <button class="btn pri" id="exportar" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg><span class="txt">Exportar</span></button>
  <div class="menu hidden" id="menu" role="menu">
    <div class="lin"><span>Escala</span><div class="seg" id="escala"></div></div>
    <button role="menuitem" data-acao="png">PNG com fundo <small id="dimA"></small></button>
    <button role="menuitem" data-acao="pngt">PNG sem fundo <small id="dimB"></small></button>
    <button role="menuitem" data-acao="video">Vídeo de um ciclo <small id="dimC"></small></button>
    <div class="sep"></div>
    <button role="menuitem" data-acao="link">Copiar link desta peça</button>
    <button role="menuitem" data-acao="json">Copiar configuração</button>
  </div>
</header>

<div class="app">
  <aside class="esq" aria-label="Presets">
    <h2>meus grafismos</h2>
    <div class="salvar"><input id="nomeSalvo" placeholder="Nome da peça" aria-label="Nome para guardar"><button class="btn" id="guardar">Guardar</button></div>
    <div class="salvos" id="salvos"></div>
    <div id="presets"></div>
  </aside>
  <main class="palco" id="palco">
    <div class="moldura"><div class="quadro" id="quadro"><canvas id="cv" aria-label="Prévia do grafismo" role="img"></canvas></div><div class="alcas" id="alcas"></div></div>
    <div class="info" id="info"></div>
  </main>
  <aside class="dir" id="dir" aria-label="Ajustes"></aside>
</div>
<input type="file" id="arquivo" accept="image/*" hidden>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script>
/* ---------- paleta e base ---------- */
const COR={
  lima:['lima','#E6F344'],limaf:['lima-forte','#77A00F'],lilas:['lilás','#B19DFC'],violeta:['violeta','#7F3AEF'],
  rosa:['rosa','#FF8AE5'],rosaf:['rosa-forte','#F53890'],azul:['azul','#8AD3FA'],azulf:['azul-forte','#1764D6'],
  branco:['branco','#F5F5F5'],cinza:['cinza','#D3D3D3'],cinzam:['cinza-médio','#6B6B6B'],grafite:['grafite','#333333'],preto:['preto','#101010'],
  transp:['transparente','#00000000']
};
const ehT=k=>k==='transp';
const nomeHex=k=>ehT(k)?'transparente':`${COR[k][0]} ${COR[k][1]}`;
function pintar(el,k){el.classList.toggle('vazia',ehT(k));el.style.background=ehT(k)?'':COR[k][1]}
const ORDEM_COR=['lima','lilas','violeta','rosa','azul','limaf','rosaf','azulf','branco','cinza','cinzam','grafite','preto'];
const hex=k=>COR[k][1];
const rgbOf=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const ease=t=>t*t*(3-2*t);
const tri=u=>Math.abs((((u%1)+1)%1)*2-1);
const TAU=Math.PI*2;
const AST=new Path2D(document.getElementById('astpath').getAttribute('d'));
function bayer(n){if(n===1)return[[0]];const p=bayer(n/2),s=n/2,m=[];for(let y=0;y<n;y++){m[y]=[];for(let x=0;x<n;x++)m[y][x]=4*p[y%s][x%s]+[[0,2],[3,1]][Math.floor(y/s)][Math.floor(x/s)]}return m}
const BAYER={2:bayer(2),4:bayer(4),8:bayer(8)};
const reduzido=matchMedia('(prefers-reduced-motion: reduce)').matches;

const BASE={
  nome:'trio linear',w:1080,h:1350,tecnica:'pontos',
  forma:'linear',cx:.5,cy:.5,tam:1,angulo:53,freq:1.5,along:1,curva:1,warp:0,warpEsc:1,inverter:false,
  cores:[['lima',1],['lilas',1],['violeta',1]],transicao:.8,fundo:'lima',
  pixel:6,pixelForma:'quadrado',espaco:0,matriz:8,
  celulas:36,glifo:'escala',min:.3,max:1,giro:.6,corGlifo:'paleta',degraus:['lima','lima','lima','lima'],
  movimento:'parado',ciclo:8,amp:.6,

/* Pesos (proporção de área, como no documento da marca) viram paradas com posição de 0 a 1.
   As paradas ficam de modo que a fronteira entre duas cores caia onde caía antes. */
function pesosParaParadas(cores){
  const l=cores.filter(c=>c[1]>0);if(!l.length)return[['preto',.5]];
  const n=l.length;if(n===1)return[[l[0][0],.5]];
  const tot=l.reduce((a,c)=>a+c[1],0),w=l.map(c=>c[1]/tot),b=[];let acc=0;w.forEach(x=>{acc+=x;b.push(acc)});
  const A=[0],sg=[1];for(let j=0;j<n-1;j++){A.push(2*b[j]-A[j]);sg.push(-sg[j])}
  let lo=0,hi=b[0];
  for(let j=0;j<n;j++){const L=j?b[j-1]:0,U=b[j];if(sg[j]>0){lo=Math.max(lo,L-A[j]);hi=Math.min(hi,U-A[j])}else{lo=Math.max(lo,A[j]-U);hi=Math.min(hi,A[j]-L)}}
  const p=lo<=hi?A.map((a,j)=>a+sg[j]*(lo+hi)/2):w.map((x,j)=>(j?b[j-1]:0)+x/2);
  return l.map((c,j)=>[c[0],+clamp(p[j]).toFixed(3)]);
}

/* ---------- paleta com paradas ---------- */
/* Cada cor é pura na sua parada; entre duas paradas o dither troca de uma para a outra.
   A transição em 100% ocupa todo o espaço entre as paradas; em 0% vira um corte seco no meio. */
function makePal(cores,transicao){
  let l=cores.filter(c=>COR[c[0]]).map(c=>[c[0],clamp(+c[1]||0)]).sort((a,b)=>a[1]-b[1]);
  if(!l.length)l=[['preto',.5]];
  const keys=l.map(c=>c[0]),cols=keys.map(hex),p=l.map(c=>c[1]),n=l.length,tr=clamp(transicao),seg=[];
  for(let j=0;j<n-1;j++){const g=p[j+1]-p[j],m=(p[j]+p[j+1])/2,w=Math.max(1e-4,tr*g);seg.push([m-w/2,w])}
  return{keys,cols,n,at(t){for(let j=0;j<n-1;j++){const a=seg[j][0],w=seg[j][1];if(t<a)return[j,0];if(t<a+w)return[j,(t-a)/w]}return[n-1,0]}};
}

/* ---------- campo ---------- */
function makeEnv(s,t,inter){
  const W=s.w,H=s.h,M=Math.max(W,H),L=Math.max(.5,s.ciclo),Ph=TAU*t/L,amp=s.amp;
  let cx=s.cx,cy=s.cy,tam=s.tam,ang=s.angulo*Math.PI/180,fase=0,pulso=0,desl=0;
  switch(s.movimento){
    case'deriva':cx+=.22*amp*Math.sin(Ph);cy+=.18*amp*Math.sin(2*Ph);break;
    case'respirar':tam*=1+.3*amp*Math.sin(Ph);break;
    case'girar':ang+=Ph;break;
    case'fluir':fase=t/L;desl=.22*amp*Math.sin(Ph);break;
    case'pulso':pulso=amp;break;
  }
  if(s.hover==='seguir'&&inter&&inter.amt>0){cx+=(inter.sx-cx)*inter.amt;cy+=(inter.sy-cy)*inter.amt}
  return{W,H,M,ax:W/M,ay:H/M,ccx:(cx-.5)*W/M,ccy:(cy-.5)*H/M,tam:Math.max(.02,tam),ca:Math.cos(ang),sa:Math.sin(ang),
    fase,pulso,desl,Ph,T:s.movimento==='parado'?0:Ph,warp:s.warp,wf:s.warpEsc*4,along:s.along,freq:s.freq,curva:s.curva,inv:s.inverter,forma:s.forma,t};
}
function campo(e,xn,yn){
  let px=(xn-.5)*e.ax,py=(yn-.5)*e.ay;
  if(e.warp>0){const f=e.wf,T=e.T,qx=px,qy=py;
    px+=e.warp*.12*(Math.sin(qy*f+T)+.5*Math.sin((qx+qy)*f*1.7-T));
    py+=e.warp*.12*(Math.sin(qx*f*1.3-T)+.5*Math.sin((qx-qy)*f*1.9+T));}
  const dx=px-e.ccx,dy=py-e.ccy;let v;
  switch(e.forma){
    case'linear':v=.5+(dx*e.ca+dy*e.sa)/e.tam+e.desl;break;
    case'radial':v=Math.hypot(dx,dy)/e.tam+e.desl;break;
    case'faixas':v=tri((dx*e.ca+dy*e.sa)*e.freq/e.tam+e.fase);break;
    case'mancha':{const r=Math.sqrt(e.along),rx=dx*e.ca+dy*e.sa,ry=-dx*e.sa+dy*e.ca;v=Math.hypot(rx/(e.tam*r),ry*r/e.tam)+e.desl;break}
    case'anel':{const r=Math.hypot(dx,dy);v=Math.abs(r-e.tam*.5)/(e.tam*.3*e.along)+e.desl;break}
    default:v=0;
  }
  v=clamp(v);if(e.curva!==1)v=Math.pow(v,e.curva);if(e.inv)v=1-v;
  if(e.pulso){const d=Math.hypot(dx,dy);v=clamp(v+.3*e.pulso*Math.sin(d*22-e.Ph*3))}
  return v;
}

/* ---------- interação ---------- */
function novaInter(){return{px:.5,py:.5,sx:.5,sy:.5,amt:0,rings:[],trail:null,tn:0,clock:0,spawn:0,alvo:null,vivo:false}}
function passoInter(I,s,dt,alvo){
  I.clock+=dt;I.alvo=alvo;
  const k=1-Math.exp(-dt*5);I.amt+=((alvo?1:0)-I.amt)*k;
  if(alvo){const k9=1-Math.exp(-dt*9);I.sx+=(alvo[0]-I.sx)*k9;I.sy+=(alvo[1]-I.sy)*k9}
  if(s.hover==='onda'&&alvo&&I.clock-I.spawn>(alvo.auto?1.3:.4)){I.spawn=I.clock;I.rings.push({x:alvo[0],y:alvo[1],t0:I.clock})}
  I.rings=I.rings.filter(r=>I.clock-r.t0<1.8);
}
function autoAlvo(t,s){const L=Math.max(.5,s.ciclo),a=TAU*t/L;const p=[.5+.3*Math.sin(a),.5+.26*Math.sin(2*a+.6)];p.auto=true;return p}
function reforco(I,s,e,xn,yn,k,dt){
  if(!I||s.hover==='nenhum'||s.hover==='seguir')return 0;
  const dx=(xn-I.sx)*e.ax,dy=(yn-I.sy)*e.ay,d=Math.hypot(dx,dy);let b=0;
  if(s.hover==='lupa'||s.hover==='afastar')b=I.amt*ease(clamp(1-d/s.raio));
  else if(s.hover==='rastro'){const tr=I.trail;if(dt>0){tr[k]=Math.max(tr[k]*Math.exp(-dt*1.1),I.alvo?I.amt*ease(clamp(1-d/(s.raio*.45))):0);if(tr[k]>.01)I.vivo=true}b=tr[k]}
  else if(s.hover==='onda'){for(const r of I.rings){const age=(I.clock-r.t0)/1.8,rad=age*s.raio*2.4,dd=Math.hypot((xn-r.x)*e.ax,(yn-r.y)*e.ay);b=Math.max(b,(1-age)*Math.exp(-((dd-rad)**2)/(2*.035*.035)))}}
  return b*s.forca;
}
function garantirTrilha(I,n){if(!I)return;if(!I.trail||I.tn!==n){I.trail=new Float32Array(n);I.tn=n}}

/* ---------- glifos ---------- */
function glifo(g,kind,x,y,S,rot){
  g.save();g.translate(x,y);if(rot)g.rotate(rot);g.beginPath();
  if(kind==='ponto'){g.arc(0,0,S/2,0,TAU);g.fill()}
  else if(kind==='quadrado'){g.rect(-S/2,-S/2,S,S);g.fill()}
  else if(kind==='mais'){const th=S*.24;g.rect(-S/2,-th/2,S,th);g.rect(-th/2,-S/2,th,S);g.fill()}
  else if(kind==='brilho'){const r=S/2;g.moveTo(0,-r);g.quadraticCurveTo(0,0,r,0);g.quadraticCurveTo(0,0,0,r);g.quadraticCurveTo(0,0,-r,0);g.quadraticCurveTo(0,0,0,-r);g.fill()}
  else{const q=S/709;g.scale(q,q);g.translate(-354.5,-330);g.fill(AST)}
  g.restore();
}
const ESCALA=['ponto','mais','brilho','asterisco'],FATOR={ponto:.36,mais:.78,brilho:1,asterisco:.92};

/* ---------- render ---------- */
const buf=document.createElement('canvas');
function render(g,s,t,I,dt,o={}){
  const e=makeEnv(s,t,I),W=s.w,H=s.h,transp=!!o.transparente,fundo=hex(s.fundo);
  if(I)I.vivo=false;
  g.clearRect(0,0,W,H);
  if(!transp){g.fillStyle=fundo;g.fillRect(0,0,W,H);if(o.img!==false&&imgFundo)desenharImg(g,s)}
  if(s.tecnica==='pontos')renderPontos(g,s,e,I,dt,transp,fundo);else renderFaiscas(g,s,e,I,dt,transp,fundo);
}
function desenharImg(g,s){
  const im=imgFundo,iw=im.naturalWidth,ih=im.naturalHeight;if(!iw||!ih)return;
  const k=s.imgAjuste==='conter'?Math.min(s.w/iw,s.h/ih):Math.max(s.w/iw,s.h/ih),dw=iw*k,dh=ih*k;
  g.save();g.globalAlpha=clamp(s.imgOpac);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(im,(s.w-dw)/2,(s.h-dh)/2,dw,dh);g.restore();
}
function renderPontos(g,s,e,I,dt,transp,fundo){
  const W=s.w,H=s.h,px=Math.max(1,s.pixel),gw=Math.ceil(W/px),gh=Math.ceil(H/px),pal=makePal(s.cores,s.transicao);
  const Bm=BAYER[s.matriz]||BAYER[8],n=s.matriz||8,nn=n*n,rg=pal.cols.map(rgbOf);
  const pula=pal.keys.map((k,i)=>ehT(k)||(transp&&pal.cols[i].toUpperCase()===fundo.toUpperCase()));
  garantirTrilha(I,gw*gh);
  const rapido=s.pixelForma==='quadrado'&&s.espaco===0;
  let im,data,lotes;
  if(rapido){if(buf.width!==gw||buf.height!==gh){buf.width=gw;buf.height=gh}im=buf.getContext('2d').createImageData(gw,gh);data=im.data}
  else lotes=pal.cols.map(()=>[]);
  for(let y=0;y<gh;y++){const yn=(y+.5)*px/H;for(let x=0;x<gw;x++){
    const xn=(x+.5)*px/W,k=y*gw+x;let v=campo(e,xn,yn);
    const b=reforco(I,s,e,xn,yn,k,dt);if(b>v)v=b;
    const[a,f]=pal.at(v),ci=f>(Bm[y%n][x%n]+.5)/nn?a+1:a;
    if(rapido){if(pula[ci])continue;const c=rg[ci],q=k*4;data[q]=c[0];data[q+1]=c[1];data[q+2]=c[2];data[q+3]=255}
    else if(!pula[ci])lotes[ci].push(x,y);
  }}
  if(rapido){buf.getContext('2d').putImageData(im,0,0);g.imageSmoothingEnabled=false;g.drawImage(buf,0,0,gw*px,gh*px);return}
  const gap=px*s.espaco,S=px-gap,redondo=s.pixelForma==='redondo';
  lotes.forEach((l,ci)=>{if(!l.length)return;g.fillStyle=pal.cols[ci];g.beginPath();
    for(let i=0;i<l.length;i+=2){const x=l[i]*px+px/2,y=l[i+1]*px+px/2;if(redondo){g.moveTo(x+S/2,y);g.arc(x,y,S/2,0,TAU)}else g.rect(x-S/2,y-S/2,S,S)}
    g.fill()});
}
function renderFaiscas(g,s,e,I,dt,transp,fundo){
  const W=s.w,H=s.h,cols=Math.max(2,Math.round(s.celulas)),pw=W/cols,rows=Math.max(1,Math.round(H/pw)),ph=H/rows,cel=Math.min(pw,ph);
  const pal=makePal(s.cores,s.transicao),Bm=BAYER[8];
  garantirTrilha(I,cols*rows);
  const F=fundo.toUpperCase(),M=e.M;
  for(let j=0;j<rows;j++){const yn=(j+.5)/rows;for(let i=0;i<cols;i++){
    const xn=(i+.5)/cols,k=j*cols+i;let v=campo(e,xn,yn);
    const b=reforco(I,s,e,xn,yn,k,dt);if(b>v)v=b;
    const nivel=v<.25?0:v<.5?1:v<.75?2:3;
    let cor;
    if(s.corGlifo==='paleta'){const[a,f]=pal.at(v),ci=f>(Bm[j%8][i%8]+.5)/64?a+1:a;if(ehT(pal.keys[ci]))continue;cor=pal.cols[ci]}
    else{const kd=s.degraus[nivel];if(ehT(kd))continue;cor=hex(kd)}
    if(cor.toUpperCase()===F)continue;
    const kind=s.glifo==='escala'?ESCALA[nivel]:s.glifo;
    let S=cel*(s.min+(s.max-s.min)*ease(v));if(s.glifo==='escala')S*=FATOR[kind];

    if(tr>=L){rec.stop();return}
    const alvo=(s.hover!=='nenhum'&&s.autoFoco)?autoAlvo(tr,s):null;passoInter(I,s,dt,alvo);
    g.setTransform(c.width/s.w,0,0,c.height/s.h,0,0);render(g,s,tr,I,dt);requestAnimationFrame(q)})(performance.now());
}
let avT=0;function avisar(m,ms=2600){const a=document.getElementById('aviso');a.textContent=m;a.classList.add('on');clearTimeout(avT);avT=setTimeout(()=>a.classList.remove('on'),ms)}

/* ---------- info ---------- */
function atualizarInfo(){
  const tec=S.tecnica==='pontos'?'pontos':'faíscas';
  const cores=S.cores.map(c=>`${nomeHex(c[0])} ${Math.round(c[1]*100)}%`).join(' · ');
  document.getElementById('info').textContent=`${S.w} × ${S.h} · ${tec} · ${S.forma} · ${S.tecnica==='faiscas'&&S.corGlifo==='degraus'?'glifos '+[...new Set(S.degraus)].map(nomeHex).join(' · '):cores} · fundo ${hex(S.fundo)}${imgFundo?' · imagem de fundo':''}`;
}

/* ---------- cursor ---------- */
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();inter.px=(e.clientX-r.left)/r.width;inter.py=(e.clientY-r.top)/r.height;hovering=true});
cv.addEventListener('pointerleave',()=>{hovering=false});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();hovering=true;inter.px=(e.clientX-r.left)/r.width;inter.py=(e.clientY-r.top)/r.height;if(S.hover==='onda')inter.rings.push({x:inter.px,y:inter.py,t0:inter.clock})});

/* ---------- laço ---------- */
let ult=0;
function quadroLoop(ms){
  const now=ms/1000,dt=Math.min(.05,ult?now-ult:.016);ult=now;
  if(tocando)t+=dt;
  let alvo=null;
  if(S.hover!=='nenhum'){if(hovering)alvo=[inter.px,inter.py];else if(S.autoFoco&&tocando)alvo=autoAlvo(t,S)}
  passoInter(inter,S,dt,alvo);
  const animado=tocando&&(S.movimento!=='parado'||(alvo&&alvo.auto));
  if(sujo)posicionarAlcas();
  if(sujo||animado||hovering||inter.amt>.002||inter.rings.length||inter.vivo){
    const k=cv.width/S.w;ctx.setTransform(k,0,0,cv.height/S.h,0,0);render(ctx,S,t,inter,dt,{transparente:!!S.transpPrev});sujo=false;
  }
  requestAnimationFrame(quadroLoop);
}

/* ---------- início ---------- */
const doHash=lerHash();
if(doHash){S=Object.assign(clonar(BASE),migrar(doHash));presetAtivo=null}
montarDir();marcarThumbs();syncTam();atualizarInfo();
requestAnimationFrame(quadroLoop);
</script>
