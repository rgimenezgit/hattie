<!-- @dsCard group="Cor" height=420 subtitle="Quatro famílias, clara e forte, e os neutros" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:"Clash Display";src:url("../../../../../assets/fontes/ClashDisplay-Variable.ttf");font-weight:200 700}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Regular.ttf");font-weight:400}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Medium.ttf");font-weight:500}
*{box-sizing:border-box;margin:0}body{font-family:"Poppins",sans-serif;background:var(--bg);color:var(--ink);padding:24px 28px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:6px}.f i{font-style:normal;font-size:12px;font-weight:500;letter-spacing:.02em}
.a{border-radius:24px;padding:16px;height:112px;display:flex;flex-direction:column;justify-content:flex-end}
.a b,.n b{font-family:"Clash Display",sans-serif;font-weight:500;font-size:21px;letter-spacing:-.01em}
.a span,.n span{font-size:12px}
.r{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.n{border-radius:16px;padding:14px;height:84px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--cinza)}
</style></head><body><div class="g"><div class="f"><div class="a" style="background:var(--lima);color:var(--preto)"><b>lima</b><span>#E6F344</span></div><div class="a" style="background:var(--lima-forte);color:var(--preto)"><b>lima-forte</b><span>#77A00F</span></div><i>Ação</i></div><div class="f"><div class="a" style="background:var(--lilas);color:var(--preto)"><b>lilas</b><span>#B19DFC</span></div><div class="a" style="background:var(--violeta);color:var(--branco)"><b>violeta</b><span>#7F3AEF</span></div><i>Marca</i></div><div class="f"><div class="a" style="background:var(--rosa);color:var(--preto)"><b>rosa</b><span>#FF8AE5</span></div><div class="a" style="background:var(--rosa-forte);color:var(--preto)"><b>rosa-forte</b><span>#F53890</span></div><i>Pessoas</i></div><div class="f"><div class="a" style="background:var(--azul);color:var(--preto)"><b>azul</b><span>#8AD3FA</span></div><div class="a" style="background:var(--azul-forte);color:var(--branco)"><b>azul-forte</b><span>#1764D6</span></div><i>Estratégia</i></div></div><div class="r"><div class="n" style="background:var(--branco);color:var(--preto)"><b>branco</b><span>#F5F5F5</span></div><div class="n" style="background:var(--cinza);color:var(--preto)"><b>cinza</b><span>#D3D3D3</span></div><div class="n" style="background:var(--cinza-medio);color:var(--branco)"><b>cinza-medio</b><span>#6B6B6B</span></div><div class="n" style="background:var(--grafite);color:var(--branco)"><b>grafite</b><span>#333333</span></div><div class="n" style="background:var(--preto);color:var(--branco)"><b>preto</b><span>#101010</span></div></div></body></html>
