<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>@font-face{font-family:"Clash Display";src:url("../../../../../assets/fontes/ClashDisplay-Variable.ttf");font-weight:200 700}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Regular.ttf");font-weight:400}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Medium.ttf");font-weight:500}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-SemiBold.ttf");font-weight:600}
@font-face{font-family:"Poppins";src:url("../../../../../assets/fontes/Poppins-Italic.ttf");font-weight:400;font-style:italic}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-text);color:var(--ink);background:var(--bg)}
.star{display:inline-block;width:1em;height:1em;vertical-align:-0.12em}

.c{position:relative;height:300px;overflow:hidden;background:var(--lilas);padding:32px 40px;display:flex;flex-direction:column;justify-content:flex-end}
.b{position:absolute}
.b1{right:-40px;top:-40px;width:240px;height:240px;border-radius:40px;background:var(--lima)}
.b2{right:200px;top:40px;width:96px;height:96px;border-radius:9999px;background:var(--preto)}
.b3{right:64px;bottom:-24px;width:160px;height:96px;border-radius:24px;background:var(--rosa)}
.b4{right:250px;bottom:32px;width:64px;height:64px;border-radius:16px;background:var(--azul)}
.b5{right:340px;top:-24px;width:96px;height:96px;border-radius:9999px;background:var(--violeta)}
h1{position:relative;font-family:var(--font-display);font-weight:500;font-size:67px;line-height:1;letter-spacing:-.02em;color:var(--preto)}
p{position:relative;font-size:16px;margin-top:12px;color:var(--grafite)}
</style></head><body><div class="c"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i><i class="b b4"></i><i class="b b5"></i>
<h1>hattie</h1><p>seu mago de marca · sistema visual</p></div></body></html>
